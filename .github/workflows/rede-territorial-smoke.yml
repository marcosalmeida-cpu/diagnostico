name: Validar rede territorial MDS e Ipea
on:
  push:
    branches: [feat/v8-etapa2-ips-cartografia]
    paths:
      - api/rede-suas.js
      - api/rede-oscs.js
      - scripts/validar-rede-territorial.js
      - .github/workflows/rede-territorial-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node scripts/validar-rede-territorial.js
