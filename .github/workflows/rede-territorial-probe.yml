name: Inspecionar diretorios territoriais
on:
  push:
    branches: [feat/v8-etapa2-ips-cartografia]
    paths:
      - scripts/probe-diretorios-detalhe.js
      - .github/workflows/rede-territorial-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/probe-diretorios-detalhe.js
