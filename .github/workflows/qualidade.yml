name: Qualidade do Diagnóstico Territorial

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validar:
    name: Dados, código e PDF
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Buscar código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Validar sintaxe
        run: npm run check
      - name: Verificar fontes e relatório
        run: npm test
      - name: Inspecionar esquemas públicos (Etapa 1)
        if: github.ref == 'refs/heads/feat/v7-etapa1-fiscal-pib'
        continue-on-error: true
        run: node scripts/probe-fontes-etapa1.js
      - name: Validar APIs oficiais por três municípios
        if: github.ref == 'refs/heads/feat/v7-etapa1-fiscal-pib'
        run: node scripts/validar-etapa1.js
      - name: Validar diagnóstico integrado de BH
        if: github.ref == 'refs/heads/feat/v7-etapa1-fiscal-pib'
        run: node scripts/validar-diagnostico-etapa1.js
      - name: Gerar relatório real e verificar o mapa na página 2
        if: github.ref == 'refs/heads/feat/v8-etapa2-ips-cartografia'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils && node scripts/validar-etapa2.js
      - name: Validar educação em BH, SP e Ribeirão das Neves
        if: github.ref == 'refs/heads/feat/v9-etapa3-educacao-juventude'
        run: node scripts/validar-etapa3.js
      - name: Verificar PDF completo Etapa 3
        if: github.ref == 'refs/heads/feat/v9-etapa3-educacao-juventude'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils && node scripts/validar-relatorio-etapa3.js
      - name: Verificar auditoria real, educação e PDF municipal · Etapa 4
        if: github.ref == 'refs/heads/feat/v10-etapa4-auditoria-rastreabilidade'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils && node scripts/validar-relatorio-etapa3.js
      - name: Verificar auditoria social, Pop Rua nacional e PDF municipal · V11
        if: github.ref == 'refs/heads/feat/v11-protecao-social-nacional'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils && node scripts/validar-relatorio-etapa3.js
