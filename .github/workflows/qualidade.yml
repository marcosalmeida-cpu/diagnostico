name: Qualidade do Diagnóstico Territorial

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validar:
    name: Dados, código e PDF
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Buscar código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Validar sintaxe
        run: npm run check
      - name: Verificar fontes e relatório
        run: npm test
      - name: Inspecionar esquemas públicos (Etapa 1)
        if: github.ref == 'refs/heads/feat/v7-etapa1-fiscal-pib'
        continue-on-error: true
        run: node scripts/probe-fontes-etapa1.js
      - name: Validar APIs oficiais por três municípios
        if: github.ref == 'refs/heads/feat/v7-etapa1-fiscal-pib'
        run: node scripts/validar-etapa1.js
      - name: Validar diagnóstico integrado de BH
        if: github.ref == 'refs/heads/feat/v7-etapa1-fiscal-pib'
        run: node scripts/validar-diagnostico-etapa1.js
      - name: Inspecionar APIs e fontes públicas da etapa 2
        if: github.ref == 'refs/heads/feat/v8-etapa2-ips-cartografia'
        continue-on-error: true
        run: node scripts/probe-fontes-etapa2.js
      - name: Inspecionar formatos de dados IPS e malhas internas
        if: github.ref == 'refs/heads/feat/v8-etapa2-ips-cartografia'
        continue-on-error: true
        run: node scripts/probe-etapa2-detalhe.js
